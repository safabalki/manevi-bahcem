<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2160px; height: 3840px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 70% 45% at 50% 42%, var(--glow) 0%, transparent 70%),
      linear-gradient(170deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 85% 75% at 50% 45%, transparent 55%, rgba(0,0,0,.65) 100%);
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="yildiz" width="240" height="240" patternUnits="userSpaceOnUse">
      <g fill="none" style="stroke: var(--cizgi)" stroke-width="3">
        <rect x="50" y="50" width="140" height="140"/>
        <rect x="50" y="50" width="140" height="140" transform="rotate(45 120 120)"/>
        <circle cx="120" cy="120" r="34"/>
        <path d="M0 0 L50 50 M240 0 L190 50 M0 240 L50 190 M240 240 L190 190"/>
      </g>
    </pattern>
    <radialGradient id="maske" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="m"><rect width="100%" height="100%" fill="url(#maske)"/></mask>
  </defs>
  <rect width="100%" height="100%" fill="url(#yildiz)" mask="url(#m)"/>
</svg>
<div class="vignette"></div>
<script>
  const D = /*DATA*/;
  for (const [k, v] of Object.entries(D.renkler)) document.documentElement.style.setProperty('--' + k, v);
</script>
</body>
</html>

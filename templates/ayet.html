<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Amiri Quran"; src: url("/*FONTS*/AmiriQuran-Regular.ttf"); }
  @font-face { font-family: "Montserrat"; src: url("/*FONTS*/Montserrat.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  /* Shorts arayüzü üstte ~220px, altta ~480px, sağda ~150px kaplar; içerik bu güvenli alanda kalır. */
  .alan {
    position: absolute; left: 90px; right: 150px; top: 400px; bottom: 580px;
    display: flex; align-items: center; justify-content: center;
  }
  .ic { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 40px; }
  .ust {
    font: 600 30px "Montserrat"; letter-spacing: .22em; text-transform: uppercase;
    color: var(--altin); opacity: .9;
  }
  .arapca {
    font-family: "Amiri Quran"; direction: rtl; line-height: 1.9;
    text-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  .arapca span { white-space: nowrap; }
  /* Karaoke: okunan kelime parlar, okunanlar altın, sıradakiler soluk. */
  .okundu { color: var(--altin); }
  .aktif { color: #fff; text-shadow: 0 0 10px var(--altin), 0 0 34px var(--altin), 0 4px 24px rgba(0,0,0,.6); }
  .bekliyor { color: rgba(255,255,255,.42); }
  .no { color: var(--altin); }
  .ayrac { width: 180px; height: 3px; background: linear-gradient(90deg, transparent, var(--altin), transparent); }
  .meal {
    font-family: "Montserrat"; font-weight: 700; line-height: 1.3; color: #fff;
    text-shadow: 0 3px 18px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9);
  }
  .kanal {
    position: absolute; left: 0; right: 0; bottom: 500px; text-align: center;
    font: 600 26px "Montserrat"; letter-spacing: .18em; color: rgba(255,255,255,.55);
  }
</style>
</head>
<body>
<div class="alan" id="alan"><div class="ic" id="ic">
  <div class="ust" id="ust"></div>
  <div class="arapca" id="arapca"></div>
  <div class="ayrac"></div>
  <div class="meal" id="meal"></div>
</div></div>
<div class="kanal" id="kanal"></div>
<script>
  const D = /*DATA*/;
  document.documentElement.style.setProperty('--altin', D.altin);
  document.getElementById('ust').textContent = D.ust;
  document.getElementById('meal').textContent = D.meal;
  document.getElementById('kanal').textContent = D.kanal;

  const ar = document.getElementById('arapca');
  D.kelimeler.forEach((k, i) => {
    const s = document.createElement('span');
    s.className = i < D.aktif ? 'okundu' : i === D.aktif ? 'aktif' : 'bekliyor';
    s.textContent = k;
    // Ayet numarası son kelimeye yapışık: tek başına alt satıra düşmesin.
    if (i === D.kelimeler.length - 1) {
      const no = document.createElement('span');
      no.className = 'no';
      no.textContent = ' ' + D.ayet_no;
      s.appendChild(no);
    }
    ar.append(s, ' ');
  });

  // Metin uzunluğu ayetten ayete değiştiği için yazıyı alana sığana kadar küçültüyoruz.
  // Kelimenin rengi düzeni etkilemediği için aynı ayetin bütün kareleri aynı yerleşimde kalır.
  function sigdir() {
    const alan = document.getElementById('alan'), ic = document.getElementById('ic');
    const tr = document.getElementById('meal');
    let a = 116, t = 76;
    const uygula = () => { ar.style.fontSize = a + 'px'; tr.style.fontSize = t + 'px'; };
    uygula();
    while (ic.offsetHeight > alan.clientHeight && t > 30) { a -= 4; t -= 3; uygula(); }
  }
  document.fonts.ready.then(sigdir);
</script>
</body>
</html>

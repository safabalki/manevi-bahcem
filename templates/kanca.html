<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Montserrat"; src: url("/*FONTS*/Montserrat.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  .kanca {
    position: absolute; top: 230px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 760px;
    font: 700 40px/1.3 "Montserrat"; color: #fff; text-align: center;
    background: rgba(0,0,0,.42); border: 2px solid var(--altin); border-radius: 22px;
    padding: 16px 30px; box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="kanca" id="kanca"></div>
<script>
  const D = /*DATA*/;
  document.documentElement.style.setProperty('--altin', D.altin);
  document.getElementById('kanca').textContent = D.kanca;
</script>
</body>
</html>

name: Günün Ayeti

on:
  schedule:
    # Her saat kontrol; sira.py günde 3 videoyu (TR 07, 13, 19) tamamlar. GitHub cron'u geciktirse ya da
    # atlasa bile eksik video bir sonraki saatte yüklenir, fazlası yüklenmez.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Kaç video (sıradaki ayetlerden)"
        default: "1"
      id:
        description: "Belirli ayet id (boş = sıradaki)"
        default: ""
      gizlilik:
        description: "Gizlilik"
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write   # yayinlananlar.json'u depoya geri yazmak için

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  uret-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sıra kontrolü
        id: sira
        env:
          OLAY: ${{ github.event_name }}
          ELLE_ADET: ${{ inputs.adet || '1' }}
        run: |
          if [ "$OLAY" = "schedule" ]; then echo "adet=$(python3 sira.py)" >> "$GITHUB_OUTPUT"
          else echo "adet=$ELLE_ADET" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.sira.outputs.adet != '0'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.sira.outputs.adet != '0'

      # Tilavet, API cevapları ve Pixabay klipleri her gece yeniden indirilmesin.
      - uses: actions/cache@v4
        if: steps.sira.outputs.adet != '0'
        with:
          path: |
            cache/api
            cache/ses
            cache/pixabay
          key: indirilenler-${{ github.run_id }}
          restore-keys: indirilenler-

      - name: Üret ve yükle
        if: steps.sira.outputs.adet != '0'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TARAYICI: /usr/bin/google-chrome
          ADET: ${{ steps.sira.outputs.adet }}
          GIZLILIK: ${{ inputs.gizlilik || 'public' }}
          AYET: ${{ inputs.id }}
        run: |
          if [ -n "$AYET" ]; then python gunluk.py --id "$AYET" --gizlilik "$GIZLILIK"
          else python gunluk.py --adet "$ADET" --gizlilik "$GIZLILIK"; fi

      - name: Yayınlananları kaydet
        if: always() && steps.sira.outputs.adet != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add yayinlananlar.json tiktok-token.enc 2>/dev/null || git add yayinlananlar.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Yayınlandı: $(date -u +%F)"
          git pull --rebase -q origin main && git push

      - uses: actions/upload-artifact@v4
        if: always() && steps.sira.outputs.adet != '0'
        with:
          name: videolar
          path: out/
          retention-days: 7

name: Instagram Geçmiş

# Daha önce YouTube'a yüklenmiş videoları (en çok izlenen önce) Instagram'a Reels olarak paylaşır.
on:
  schedule:
    # Her akşam 2 eski video, aralıklı (TR ~20:40 ve ~22:40). Gidecek video kalmayınca hiçbir şey yapmaz.
    - cron: "41 17 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Kaç video (0 = yalnızca sırayı göster)"
        default: "1"

permissions:
  contents: write   # yayinlananlar.json'u depoya geri yazmak için

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            cache/api
            cache/ses
            cache/pixabay
          key: indirilenler-${{ github.run_id }}
          restore-keys: indirilenler-
      - name: Paylaş
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TARAYICI: /usr/bin/google-chrome
          ADET: ${{ inputs.adet || '1' }}
        run: |
          if [ "$ADET" = "0" ]; then python instagram_gecmis.py --liste; else python instagram_gecmis.py --adet "$ADET"; fi
      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add yayinlananlar.json
          git diff --cached --quiet && exit 0
          git commit -m "Instagram geçmiş: $(date -u +%F)"
          git pull --rebase -q origin main && git push

name: Instagram-Facebook Geçmiş

# Daha önce YouTube'a yüklenmiş videoları (en çok izlenen önce) Instagram'a Reels olarak paylaşır.
on:
  schedule:
    # Her saat kontrol; gecmis_sira.py akşam (TR 20-23) bugün 2'den az eski video gittiyse 1 video paylaştırır.
    # (Günde iki kez çalışan zamanlamayı GitHub hiç tetiklemedi; saatlik olan güvenilir çalışıyor.)
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Kaç video (0 = yalnızca sırayı göster)"
        default: "1"

permissions:
  contents: write   # yayinlananlar.json'u depoya geri yazmak için

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Sıra kontrolü
        id: sira
        env:
          OLAY: ${{ github.event_name }}
        run: |
          if [ "$OLAY" = "schedule" ]; then echo "calis=$(python3 gecmis_sira.py)" >> "$GITHUB_OUTPUT"
          else echo "calis=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.sira.outputs.calis == '1'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.sira.outputs.calis == '1'
      - uses: actions/cache@v4
        if: steps.sira.outputs.calis == '1'
        with:
          path: |
            cache/api
            cache/ses
            cache/pixabay
          key: indirilenler-${{ github.run_id }}
          restore-keys: indirilenler-
      - name: Paylaş
        if: steps.sira.outputs.calis == '1'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TARAYICI: /usr/bin/google-chrome
          ADET: ${{ inputs.adet || '1' }}
        run: |
          if [ "$ADET" = "0" ]; then python instagram_gecmis.py --liste; else python instagram_gecmis.py --adet "$ADET"; fi
      - name: Kaydet
        if: always() && steps.sira.outputs.calis == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add yayinlananlar.json
          git diff --cached --quiet && exit 0
          git commit -m "Instagram geçmiş: $(date -u +%F)"
          git pull --rebase -q origin main && git push

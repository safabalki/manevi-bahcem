name: Ses örnekleri

on:
  push:
    branches: [claude/ses-ornekleri]
    paths: [ornek/ses_ornek.py, .github/workflows/ses-ornek.yml]

permissions:
  contents: write

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install imageio-ffmpeg requests edge-tts piper-tts
      - run: python ornek/ses_ornek.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ornek/
          git commit -m "Ses örnekleri"
          git push

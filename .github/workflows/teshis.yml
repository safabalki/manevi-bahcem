name: Teşhis

on:
  push:
    branches: [claude/teshis]

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Üret (bellek izlenerek)
        env:
          TARAYICI: /usr/bin/google-chrome
        run: |
          (while true; do echo "$(date +%T) $(free -m | awk '/Mem/{print "kullanılan="$3"MB"}')"; sleep 5; done) &
          /usr/bin/time -v python gunluk.py --id fatiha --sadece-uret 2>&1 | grep -E "Üretildi|Maximum resident|Exit status|Error|error"
      - name: Kareler
        run: |
          F=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p teshis
          for t in 1 8 20 35 45; do $F -loglevel error -y -ss $t -i out/fatiha.mp4 -frames:v 1 -vf scale=360:-1 teshis/fatiha-$t.jpg; done
          $F -i out/fatiha.mp4 2>&1 | grep Duration > teshis/sure.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add teshis && git commit -m "Teşhis kareleri" && git push
